<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>T-Rex Endless Runner</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #f7f7f7;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }
        #game-container {
            position: relative;
            width: 800px;
            height: 250px;
            background-color: #ffffff;
            border-bottom: 2px solid #535353;
            overflow: hidden;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        #dino {
            position: absolute;
            bottom: 0;
            left: 50px;
            width: 44px;
            height: 47px;
            background-color: #535353;
            /* Simple pixel-art approximation using clip-path */
            clip-path: polygon(30% 0%, 85% 0%, 100% 15%, 100% 40%, 80% 45%, 85% 55%, 55% 55%, 55% 75%, 70% 75%, 70% 85%, 50% 85%, 40% 65%, 30% 65%, 30% 85%, 15% 85%, 25% 55%, 0% 45%, 0% 25%, 30% 25%);
            transition: height 0.1s, bottom 0s;
        }
        #dino.ducking {
            height: 30px;
            clip-path: polygon(0% 40%, 60% 40%, 75% 0%, 100% 0%, 100% 50%, 80% 100%, 0% 100%);
        }
        .obstacle {
            position: absolute;
            bottom: 0;
            background-color: #535353;
        }
        .cactus {
            width: 25px;
            height: 50px;
            clip-path: polygon(30% 0%, 70% 0%, 70% 30%, 100% 30%, 100% 60%, 70% 60%, 70% 100%, 30% 100%, 30% 50%, 0% 50%, 0% 20%, 30% 20%);
        }
        .bird {
            width: 35px;
            height: 25px;
            bottom: 50px;
            clip-path: polygon(0% 50%, 40% 20%, 60% 20%, 100% 0%, 80% 60%, 50% 80%, 30% 50%);
            animation: flap 0.2s infinite alternate;
        }
        @keyframes flap {
            0% { transform: translateY(0); }
            100% { transform: translateY(-5px); }
        }
        #score-board {
            position: absolute;
            top: 10px;
            right: 20px;
            font-size: 18px;
            color: #535353;
            font-weight: bold;
        }
        #game-over-screen {
            display: none;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(255, 255, 255, 0.8);
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #535353;
        }
        #game-over-screen h1 {
            font-size: 32px;
            margin-bottom: 15px;
            letter-spacing: 3px;
        }
        #game-over-screen button {
            padding: 10px 20px;
            background-color: #535353;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-family: inherit;
            font-size: 16px;
        }
        #game-over-screen button:hover {
            background-color: #333;
        }
        #controls-info {
            margin-top: 15px;
            color: #777;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <div id="game-container">
        <div id="score-board">HI <span id="high-score">00000</span> <span id="current-score">00000</span></div>
        <div id="dino"></div>
        <div id="game-over-screen">
            <h1>G A M E  O V E R</h1>
            <button id="restart-btn">PLAY AGAIN</button>
        </div>
    </div>
    <div id="controls-info">SPACE / UP = Jump | DOWN = Duck</div>

    <script>
        const dino = document.getElementById('dino');
        const gameContainer = document.getElementById('game-container');
        const currentScoreElement = document.getElementById('current-score');
        const highScoreElement = document.getElementById('high-score');
        const gameOverScreen = document.getElementById('game-over-screen');
        const restartBtn = document.getElementById('restart-btn');

        // Game Configuration Variables
        let isJumping = false;
        let isDucking = false;
        let gravity = 0.6;
        let position = 0; 
        let velocity = 0;
        let isGameOver = false;
        let score = 0;
        let highScore = 0;
        let gameSpeed = 6;
        let obstacles = [];
        let obstacleTimeout = null;

        // Listen for keyboard inputs
        document.addEventListener('keydown', handleKeyDown);
        document.addEventListener('keyup', handleKeyUp);
        restartBtn.addEventListener('click', resetGame);

        function handleKeyDown(e) {
            if (isGameOver) return;
            
            if ((e.code === 'Space' || e.code === 'ArrowUp') && !isJumping && !isDucking) {
                isJumping = true;
                velocity = 12; // Jump force
            }
            if (e.code === 'ArrowDown' && !isJumping) {
                isDucking = true;
                dino.classList.add('ducking');
            }
        }

        function handleKeyUp(e) {
            if (e.code === 'ArrowDown') {
                isDucking = false;
                dino.classList.remove('ducking');
            }
        }

        // Main game physics loop
        function updateGame() {
            if (isGameOver) return;

            // 1. Handle Dino Gravity and Jumping
            if (isJumping) {
                position += velocity;
                velocity -= gravity;
                if (position <= 0) {
                    position = 0;
                    isJumping = false;
                    velocity = 0;
                }
                dino.style.bottom = position + 'px';
            }

            // 2. Increment Score and Speed Over Time
            score += 0.15;
            currentScoreElement.innerText = String(Math.floor(score)).padStart(5, '0');
            if (Math.floor(score) % 100 === 0 && score > 1) {
                gameSpeed += 0.05; // Make the game progressively faster
            }

            // 3. Move and Manage Obstacles
            for (let i = obstacles.length - 1; i >= 0; i--) {
                let obstacle = obstacles[i];
                let currentLeft = parseFloat(obstacle.style.left);
                currentLeft -= gameSpeed;
                obstacle.style.left = currentLeft + 'px';

                // Remove out-of-bounds obstacles
                if (currentLeft < -40) {
                    obstacle.remove();
                    obstacles.splice(i, 1);
                    continue;
                }

                // 4. Precision Collision Detection Mechanics
                let dinoRect = dino.getBoundingClientRect();
                let obsRect = obstacle.getBoundingClientRect();

                if (
                    dinoRect.left < obsRect.right &&
                    dinoRect.right > obsRect.left &&
                    dinoRect.top < obsRect.bottom &&
                    dinoRect.bottom > obsRect.top
                ) {
                    endGame();
                }
            }

            requestAnimationFrame(updateGame);
        }

        // Procedural obstacle spawner engine
        function spawnObstacle() {
            if (isGameOver) return;

            const obstacle = document.createElement('div');
            const isBird = Math.random() > 0.7 && score > 150; // Birds appear later

            obstacle.classList.add('obstacle');
            if (isBird) {
                obstacle.classList.add('bird');
                // Randomly place bird high or medium height
                obstacle.style.bottom = (Math.random() > 0.5 ? '65px' : '30px');
            } else {
                obstacle.classList.add('cactus');
                // Randomly vary cactus scaling variants
                if(Math.random() > 0.6) {
                    obstacle.style.height = '65px';
                    obstacle.style.width = '30px';
                }
            }

            obstacle.style.left = '800px';
            gameContainer.appendChild(obstacle);
            obstacles.push(obstacle);

            // Dynamically scale down spawn timings as velocity increases
            let randomDelay = Math.random() * (2000 - 900) + 900;
            randomDelay = randomDelay / (gameSpeed / 6);
            obstacleTimeout = setTimeout(spawnObstacle, randomDelay);
        }

        function endGame() {
            isGameOver = true;
            gameOverScreen.style.display = 'flex';
            clearTimeout(obstacleTimeout);
            if (score > highScore) {
                highScore = Math.floor(score);
                highScoreElement.innerText = String(highScore).padStart(5, '0');
            }
        }

        function resetGame() {
            // Clear current obstacle nodes from layout
            obstacles.forEach(obs => obs.remove());
            obstacles = [];
            clearTimeout(obstacleTimeout);

            // Reinitialize metrics
            score = 0;
            gameSpeed = 6;
            position = 0;
            isJumping = false;
            isDucking = false;
            isGameOver = false;
            
            dino.style.bottom = '0px';
            dino.classList.remove('ducking');
            gameOverScreen.style.display = 'none';

            // Re-boot runtime threads
            updateGame();
            spawnObstacle();
        }

        // Init Engine Initialization
        updateGame();
        spawnObstacle();
    </script>
</body>
</html>
